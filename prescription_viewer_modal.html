<!-- Prescription Viewer Modal -->
<div id="prescriptionViewerModal" class="modal" style="display: none;">
    <div class="modal-content prescription-modal" style="max-width: 800px;">
        <div class="modal-header">
            <div>
                <h2 id="rxPrescriptionNumber">Prescription</h2>
                <p class="rx-date">Date: <span id="rxDate"></span></p>
            </div>
            <span class="close" onclick="PrescriptionViewer.close()">&times;</span>
        </div>

        <div class="modal-body">
            <!-- Doctor Info -->
            <div class="doctor-info-section">
                <h3>Prescribed By</h3>
                <p><strong id="rxDoctorName"></strong></p>
                <p><span id="rxQualification"></span></p>
                <p>Reg. No: <span id="rxRegNumber"></span></p>
            </div>

            <!-- Diagnosis -->
            <div class="diagnosis-section">
                <h3>Diagnosis</h3>
                <p id="rxDiagnosis"></p>
            </div>

            <!-- Medicines -->
            <div class="medicines-section">
                <h3>Prescribed Medicines</h3>
                <div id="rxMedicinesList"></div>
            </div>

            <!-- Patient Notes -->
            <div id="rxPatientNotesSection" class="notes-section" style="display: none;">
                <h3>Instructions for Patient</h3>
                <p id="rxPatientNotes"></p>
            </div>

            <!-- Action Buttons -->
            <div class="button-group">
                <button type="button" class="btn btn-secondary" onclick="PrescriptionViewer.printPrescription()">
                    🖨️ Print
                </button>

                <button type="button" class="btn btn-primary" onclick="PrescriptionViewer.openOrderModal()">
                    🛒 Order Medicines
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Medicine Order Modal -->
<div id="medicineOrderModal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 600px;">
        <div class="modal-header">
            <h2>Order Medicines</h2>
            <span class="close"
                onclick="document.getElementById('medicineOrderModal').style.display='none'">&times;</span>
        </div>

        <div class="modal-body">
            <h3>Choose Fulfillment Method</h3>

            <div class="radio-group">
                <label class="radio-option">
                    <input type="radio" name="fulfillmentType" value="pickup" checked
                        onchange="PrescriptionViewer.toggleDeliveryFields()">
                    <div class="radio-content">
                        <strong>🏪 Pharmacy Pickup</strong>
                        <p>Collect from nearest pharmacy</p>
                    </div>
                </label>

                <label class="radio-option">
                    <input type="radio" name="fulfillmentType" value="delivery"
                        onchange="PrescriptionViewer.toggleDeliveryFields()">
                    <div class="radio-content">
                        <strong>🚚 Home Delivery</strong>
                        <p>Get medicines delivered to your address</p>
                    </div>
                </label>
            </div>

            <!-- Delivery Fields (hidden by default) -->
            <div id="deliveryFields" style="display: none;">
                <div class="form-group">
                    <label for="deliveryAddress">Delivery Address *</label>
                    <textarea id="deliveryAddress" rows="3" placeholder="Enter complete delivery address..."></textarea>
                </div>

                <div class="form-group">
                    <label for="deliveryContact">Contact Number *</label>
                    <input type="tel" id="deliveryContact" placeholder="Enter contact number...">
                </div>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-secondary"
                    onclick="document.getElementById('medicineOrderModal').style.display='none'">
                    Cancel
                </button>

                <button type="button" class="btn btn-primary" id="orderMedicinesBtn"
                    onclick="PrescriptionViewer.createOrder()">
                    Confirm Order
                </button>
            </div>
        </div>
    </div>
</div>
